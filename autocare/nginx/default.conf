upstream autocare_backend {
    least_conn;
    server web1:5000;
    server web2:5000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/autocare.crt;
    ssl_certificate_key /etc/nginx/certs/autocare.key;

    location / {
        proxy_pass http://autocare_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header X-Upstream-Addr $upstream_addr always;
    }
}
